[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every route.
#
# CSP notes:
# - script-src does NOT allow 'unsafe-inline'. Every executable script must be
#   an external file (GA init lives in /scripts/ga-init.js, used by the Astro
#   layout, /maui.html and /legacy/index.html). If you add a <script> to an
#   Astro component or a page in public/, check the build for inline scripts:
#     grep -rn "<script" dist --include=*.html | grep -v "src=" | grep -v "ld+json"
#   If one is unavoidable, allow it with a 'sha256-...' hash, not 'unsafe-inline'.
# - Font Awesome, Google Fonts and YouTube are allowed only because the legacy
#   pages use them. Remove them once those pages are retired.
# - style-src keeps 'unsafe-inline': Astro inlines small stylesheets and the
#   legacy pages use style="" attributes. Inline styles can't execute code.
# - JSON-LD (<script type="application/ld+json">) is a data block, not
#   executed, so CSP doesn't block it.
# - The trailing backslashes are TOML line continuations, so the header is
#   sent as a single line.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' https://www.googletagmanager.com https://kit.fontawesome.com; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ka-f.fontawesome.com; \
      font-src 'self' https://fonts.gstatic.com https://ka-f.fontawesome.com; \
      img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; \
      connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com \
        https://*.googletagmanager.com https://ka-f.fontawesome.com; \
      frame-src https://www.youtube.com https://www.youtube-nocookie.com; \
      media-src 'self'; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      upgrade-insecure-requests"""
